services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"     # host access (optional)
      - "29092:29092"   # docker network access (optional)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listeners: internal for containers, external for host
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  producer:
    build: ./services/producer
    env_file: .env
    depends_on:
      - kafka
    volumes:
      - ./services/producer/app:/app/app
      - ./data:/app/data:ro   # TODO, JSONL job desc input
    working_dir: /app
    command: ["python", "-m", "app.main"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./services/api
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./services/api:/app
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - VITE_API_BASE=http://localhost:${API_PORT}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  spark:
    build: ./services/spark
    env_file: .env
    depends_on:
      - kafka
      - postgres
    volumes:
      - ./services/spark/app:/opt/spark-app
      - spark-checkpoints:/checkpoints
    # For Day 1: keep it idle so compose is stable.
    command: ["bash", "-lc", "sleep infinity"]

volumes:
  pgdata:
  spark-checkpoints: